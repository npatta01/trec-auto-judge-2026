judge_class: "judges.generic.judge:GenericJudge"
create_nuggets: false
create_qrels: false
judge: true
settings:
  filebase: "{_name}"
  mode: staged
  max_prompt_chars: 120000
  max_answer_chars: 40000
  document_chunk_chars: 12000
  chunk_overlap: 256
  max_tokens: 8192
  schema_attempts: 2
  structured_output: false
  evidence_format: quotes
variants:
  staged:
    mode: staged
  direct:
    mode: direct
  staged_spans:
    mode: staged
    evidence_format: spans
    structured_output: true
    max_tokens: 4096
  staged_spans_openrouter:
    mode: staged
    evidence_format: spans
    structured_output: true
    max_tokens: 4096
    request_extra:
      provider:
        max_price: {prompt: 1, completion: 3, request: 0}
        require_parameters: true
        allow_fallbacks: false
        data_collection: deny
      reasoning: {enabled: false}

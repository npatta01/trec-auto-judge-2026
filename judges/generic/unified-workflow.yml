judge_class: "judges.generic.unified:UnifiedJudge"
uses_llm: true
create_nuggets: false
create_qrels: false
judge: true
settings:
  coverage_mode: separate
  resolve_partial_grounding: true
  partial_max_output_tokens: 65536
  repair_reference_length: true
  repair_reference_output: true
  repair_citation_output: true
  citation_max_output_tokens: 65536
  filebase: "{_name}"
  pairwise_weight: 0.5
  max_pairs: 100
  max_input_tokens: 45000
  document_tokens: 24000
  context_tokens: 64000
  evidence_concurrency: 1
  budget_ledger: output/budget20/budget.sqlite3
  run_budget_usd: 3.0
variants:
  rag-pairwise-10:
    judge_settings: {track: rag, method: pairwise, pairwise_opponents: 10, max_pairs: 415}
  ragtime-pairwise-10:
    judge_settings: {track: ragtime, method: pairwise, pairwise_opponents: 10, max_pairs: 245}
  rag-pairwise:
    judge_settings: {track: rag, method: pairwise}
  rag-evidence:
    judge_settings: {track: rag, method: evidence}
  rag-combined:
    judge_settings: {track: rag, method: combined}
  ragtime-pairwise:
    judge_settings: {track: ragtime, method: pairwise}
  ragtime-evidence:
    judge_settings: {track: ragtime, method: evidence}
  ragtime-combined:
    judge_settings: {track: ragtime, method: combined}

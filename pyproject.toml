[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trec-autojudge-2026"
version = "1.0.0"
description = "TREC AutoJudge 2026 participant workspace"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "npatta01"}
]
keywords = ["trec", "autojudge", "rag", "evaluation", "ir"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "autojudge-base>=1.0.0",
    "tira>=0.0.100",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
minima-llm = [
    "minima-llm>=0.2.5",
    "tiktoken>=0.14.0",
]
evaluate = [
    "autojudge-evaluate>=1.0.0",
]
all = [
    "trec-autojudge-2026[minima-llm,evaluate,test]",
    "tqdm>=4.0",
]

[project.urls]
Homepage = "https://github.com/npatta01/trec-auto-judge-2026"
Repository = "https://github.com/npatta01/trec-auto-judge-2026"

[tool.setuptools.packages.find]
where = ["."]
include = ["judges*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
